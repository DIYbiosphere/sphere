# Production context:
# All deploys from the main repository branch
# will inherit these settings.
[context.production]
  # The algoliasearch gem verifies TLS against its own bundled ca-bundle.crt (ignores
# SSL_CERT_FILE), which lacks the USERTrust ECC root Algolia's cert now chains to.
# Append the build image's system CAs to it before indexing.
  command = "jekyll build && cat /etc/ssl/certs/ca-certificates.crt >> \"$(gem contents algoliasearch | grep resources/ca-bundle.crt | head -1)\" && jekyll algolia --verbose"

# Deploy Preview context:
# All deploys generated from a pull/merge request
# will inherit these settings.
[context.deploy-preview]
  command = "jekyll build"

# Branch deploy context:
# All deploys that are not from a pull/merge request
# or from the production branch will inherit these settings.
[context.branch-deploy]
  command = "jekyll build"

